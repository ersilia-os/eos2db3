Identifier: eos2db3
Slug: chemical-space-projections-chemdiv
Status: Ready
Title: Chemical space 2D projections against ChemDiv
Description: Projects a molecule onto a two-dimensional map built from the ChemDiv
  screening collection, letting a compound be placed visually against a widely used
  commercial library. Coordinates come from dimensionality reduction fitted to that
  reference set, so a position expresses similarity to catalogue chemistry rather
  than any predicted property. Both principal component and neighbour-embedding projections
  are returned. Positions are only meaningful relative to the fixed reference and
  cannot be compared across differently trained projections.
