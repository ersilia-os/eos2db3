Identifier: eos2db3
Slug: chemical-space-projections-chemdiv
Status: Ready
Title: Chemical space 2D projections against ChemDiv
Description: Positions a molecule against the ChemDiv diversity collection, using
  a 100,000-compound subset of that commercial catalogue as the reference chemical
  space. Ersilia represents every structure with its own compound embeddings and then
  applies three reductions fitted to the reference set, returning four principal components
  alongside a UMAP pair and a t-SNE pair. A position expresses proximity to catalogue
  chemistry rather than any predicted property, and because the projections are fixed
  to this reference they cannot be compared with maps trained on another library.
